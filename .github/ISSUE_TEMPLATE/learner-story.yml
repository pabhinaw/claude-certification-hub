name: Share your learner story
description: Tell other learners how this hub helped you. Stories are reviewed before they appear on the site.
title: "Learner story: "
labels: ["learner-story"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing! A few important notes before you start:

        * **This form is public.** Anything you write here can be seen by anyone on GitHub. Don't include your email, phone number or any private details.
        * **Never include exam questions, exam content or score details.** Exam content is confidential for every candidate.
        * Your story is published only if you give consent below, and you can ask for it to be removed at any time.
  - type: input
    id: display_name
    attributes:
      label: How should we show your name?
      description: e.g. "Asha K.", "A. Kumar", or just your role like "Backend Engineer, Bengaluru"
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role (optional)
      description: e.g. "Solution Architect" or "Software Engineer"
  - type: dropdown
    id: cert
    attributes:
      label: Which certification were you preparing for?
      options:
        - Claude Certified Architect – Foundations (CCAR-F)
        - Claude Certified Developer – Foundations (CCDV-F)
        - Other / just learning
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome (optional)
      options:
        - Passed
        - Still preparing
        - Prefer not to say
  - type: textarea
    id: story
    attributes:
      label: Your story (2–4 sentences)
      description: What helped you most? Which pages, labs or ideas made a difference?
    validations:
      required: true
  - type: input
    id: profile_link
    attributes:
      label: Public profile link (optional)
      description: A LinkedIn or GitHub profile we may link your name to. Leave empty to show no link.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree that my story, display name and (if given) profile link may be published on this site.
          required: true
        - label: My story contains no exam questions, exam content or score details.
          required: true
