      - LLM & Claude Basics: fundamentals/llm-basics.md
      - The Messages API: fundamentals/messages-api.md
      - Tool Use Basics: fundamentals/tool-use-basics.md
      - Claude Code Basics: fundamentals/claude-code-basics.md
