# ------------------------------------------------------------
# Claude Certification Hub — site configuration
# Edit site_name / site_url / repo_url after you create your repo.
# ------------------------------------------------------------
site_name: Claude Certification Hub
site_description: One-stop, basic-to-advanced learning platform for Anthropic's Claude certifications (Architect & Developer).
site_author: Prasoon Abhinaw
# GitHub username: pabhinaw
site_url: https://pabhinaw.github.io/claude-certification-hub/
repo_url: https://github.com/pabhinaw/claude-certification-hub
repo_name: claude-certification-hub
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.keys

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pabhinaw/claude-certification-hub

copyright: >
  Community study resource — not affiliated with or endorsed by Anthropic.
  Content licensed CC BY 4.0.

