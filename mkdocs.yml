# ------------------------------------------------------------
# Claude Certification Hub — site configuration
# Edit site_name / site_url / repo_url after you create your repo.
# ------------------------------------------------------------
site_name: Claude Certification Hub
site_description: Unofficial, independent basic-to-advanced study hub for the Claude certifications (Architect & Developer). Not affiliated with Anthropic.
site_author: Prasoon Abhinaw
# GitHub username: pabhinaw
site_url: https://pabhinaw.github.io/claude-certification-hub/
repo_url: https://github.com/pabhinaw/claude-certification-hub
repo_name: claude-certification-hub
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false            # use system fonts: faster, and no third-party font requests
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.keys

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/greeting.js
  - assets/mock-exam.js

extra:
  generator: false
  reviewed_on: November 2026
  # ------------------------------------------------------------------
  # Learner testimonials: REAL, CONSENTED stories only.
  # Copy each approved story from its GitHub issue. Example format:
  #   - name: "Asha K."                       # as the learner chose
  #     role: "Solution Architect"            # optional
  #     cert: "CCAR-F · Passed"               # optional
  #     quote: "Their words, unedited."
  #     link: "https://www.linkedin.com/in/…" # optional, only if they gave it
  # Leave the list empty ([]) to show the "Be the first" invitation.
  # ------------------------------------------------------------------
  testimonials: []
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/pabhinaw/
      name: Prasoon Abhinaw on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/pabhinaw/claude-certification-hub
      name: Source on GitHub

copyright: >
  &copy; 2026 Claude Certification Hub &middot; Developed by
  <a href="https://www.linkedin.com/in/pabhinaw/" target="_blank" rel="noopener">Prasoon Abhinaw</a>
  &middot; Unofficial community resource, not affiliated with, sponsored or endorsed by Anthropic.
  Claude and Anthropic are trademarks of Anthropic, PBC.
  &middot; <a href="/claude-certification-hub/resources/content-policy/">Content policy</a>

